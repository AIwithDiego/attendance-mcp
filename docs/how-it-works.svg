<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>attendance-mcp: how it works</title>
  <desc>An MCP client such as Claude Code talks JSON-RPC over stdio to the server. The server exposes seven read-only tools, a schema resource and a review prompt. A shared input check turns an unknown site or a bad date range into an error that lists the valid options, so an empty result always means nothing happened. Parameterised SQL queries read a synthetic SQLite database seeded with four planted patterns. Answers flow back as JSON the model can check. Nothing can write.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3a7"/></marker>
    <style>
      .card { fill: #0e1f18; stroke: #23392f; stroke-width: 1.5; }
      .step { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
      .h { font-size: 17px; font-weight: 700; fill: #f6ecd6; }
      .t { font-size: 13.5px; fill: #9fb3a7; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #6f8579; }
      .line { stroke: #9fb3a7; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#08130f"/>
  <text x="48" y="62" font-size="32" font-weight="800" fill="#f6ecd6">attendance-mcp</text>
  <text x="48" y="92" font-size="17" fill="#9fb3a7">A manager asks in plain words. The model picks a tool. Every answer can be checked, nothing can be changed.</text>
  <rect class="card" x="48" y="130" width="200" height="210" rx="14"/>
  <rect x="48" y="130" width="200" height="4" rx="2" fill="#4bd68f"/>
  <text class="step" x="66" y="164" fill="#4bd68f">1 · CLIENT</text>
  <text class="h" x="66" y="192">Your AI assistant</text>
  <text class="t" x="66" y="222">Claude Code, Claude</text>
  <text class="t" x="66" y="242">Desktop, Cursor or any</text>
  <text class="t" x="66" y="262">MCP client</text>
  <text class="mono" x="66" y="320">JSON-RPC over stdio</text>
  <path class="line" d="M250 235.0 H270" marker-end="url(#a)"/>
  <rect class="card" x="274" y="130" width="200" height="210" rx="14"/>
  <rect x="274" y="130" width="200" height="4" rx="2" fill="#4bd68f"/>
  <text class="step" x="292" y="164" fill="#4bd68f">2 · SERVER</text>
  <text class="h" x="292" y="192">The MCP server</text>
  <text class="t" x="292" y="222">7 tools, a schema resource,</text>
  <text class="t" x="292" y="242">a weekly review prompt,</text>
  <text class="t" x="292" y="262">every tool read-only</text>
  <text class="mono" x="292" y="320">src/server.ts</text>
  <path class="line" d="M476 235.0 H496" marker-end="url(#a)"/>
  <rect class="card" x="500" y="130" width="200" height="210" rx="14"/>
  <rect x="500" y="130" width="200" height="4" rx="2" fill="#f2b441"/>
  <text class="step" x="518" y="164" fill="#f2b441">3 · INPUT CHECK</text>
  <text class="h" x="518" y="192">Ask wrong, get told</text>
  <text class="t" x="518" y="222">Unknown site, reversed</text>
  <text class="t" x="518" y="242">or out-of-range dates:</text>
  <text class="t" x="518" y="262">an error listing what's valid</text>
  <text class="mono" x="518" y="320">scope() in src/server.ts</text>
  <path class="line" d="M702 235.0 H722" marker-end="url(#a)"/>
  <rect class="card" x="726" y="130" width="200" height="210" rx="14"/>
  <rect x="726" y="130" width="200" height="4" rx="2" fill="#4bd68f"/>
  <text class="step" x="744" y="164" fill="#4bd68f">4 · QUERIES</text>
  <text class="h" x="744" y="192">Parameterised SQL</text>
  <text class="t" x="744" y="222">Every value is a named</text>
  <text class="t" x="744" y="242">parameter. One definition</text>
  <text class="t" x="744" y="262">per metric (late rate)</text>
  <text class="mono" x="744" y="320">src/queries.ts</text>
  <path class="line" d="M928 235.0 H948" marker-end="url(#a)"/>
  <rect class="card" x="952" y="130" width="200" height="210" rx="14"/>
  <rect x="952" y="130" width="200" height="4" rx="2" fill="#4bd68f"/>
  <text class="step" x="970" y="164" fill="#4bd68f">5 · DATA</text>
  <text class="h" x="970" y="192">Synthetic SQLite</text>
  <text class="t" x="970" y="222">4 sites, 40 staff, 8 weeks,</text>
  <text class="t" x="970" y="242">fixed seed, 4 planted</text>
  <text class="t" x="970" y="262">patterns, rebuilt each start</text>
  <text class="mono" x="970" y="320">src/seed.ts</text>
  <path class="line" d="M1052.0 344 V380 H148.0 V348" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text class="t" x="600.0" y="406" text-anchor="middle">Rows come back as JSON with the counts behind every rate, so the model (and you) can check the maths</text>
  <rect x="48" y="450" width="279" height="34" rx="17" fill="#0e1f18" stroke="#4bd68f" stroke-opacity="0.6"/>
  <text x="66" y="472" font-size="13.5" fill="#f6ecd6">readOnlyHint: true on every tool</text>
  <rect x="341.2" y="450" width="386" height="34" rx="17" fill="#0e1f18" stroke="#f2b441" stroke-opacity="0.6"/>
  <text x="359.2" y="472" font-size="13.5" fill="#f6ecd6">Ambiguous name: candidates back, never a guess</text>
  <rect x="740.8" y="450" width="294" height="34" rx="17" fill="#0e1f18" stroke="#4bd68f" stroke-opacity="0.6"/>
  <text x="758.8" y="472" font-size="13.5" fill="#f6ecd6">26 tests through a real MCP client</text>
</svg>
